name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "github-pages/**"
      - ".github/workflows/pages.yaml"
      - "lib/docs-*.cjs"
      - "lib/docs-core.mjs"
      - "tests/fixtures/docs-publication-workspace.cjs"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build example API reference
        run: |
          workspace="$RUNNER_TEMP/tactical-navigation"
          node tests/fixtures/docs-publication-workspace.cjs "$workspace"
          node bin/layang.cjs docs:build "$workspace"
          node bin/layang.cjs docs:build "$workspace" --check
          mkdir -p github-pages/reference
          cp -R "$workspace/docs/site/." github-pages/reference/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
