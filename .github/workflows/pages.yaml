name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "github-pages/**"
      - ".github/workflows/pages.yaml"
      - "lib/docs-*.cjs"
      - "lib/docs-core.mjs"
      - "tests/fixtures/docs-publication-workspace.cjs"

  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build example API reference
        run: |
          workspace="$RUNNER_TEMP/tactical-navigation"
          node tests/fixtures/docs-publication-workspace.cjs "$workspace"
          node bin/layang.cjs docs:build "$workspace"
          node bin/layang.cjs docs:build "$workspace" --check
          mkdir -p github-pages/reference
          cp -R "$workspace/docs/site/." github-pages/reference/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
