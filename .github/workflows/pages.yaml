name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "github-pages/**"
      - ".github/workflows/pages.yaml"
      - "lib/docs-*.cjs"
      - "lib/docs-core.mjs"
      - "tests/fixtures/docs-publication-workspace.cjs"

  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build example API reference
        run: |
          workspace="$RUNNER_TEMP/tactical-navigation"
          node tests/fixtures/docs-publication-workspace.cjs "$workspace"
          node bin/layang.cjs docs:build "$workspace"
          node bin/layang.cjs docs:build "$workspace" --check
          mkdir -p github-pages/reference
          cp -R "$workspace/docs/site/." github-pages/reference/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: github-pages
          # v4+ skips dotfiles by default; keep publishing github-pages/.nojekyll as before.
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
