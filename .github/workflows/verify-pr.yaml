name: Verify Pull Request

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks themselves (typecheck, lint, tests with LAYANG_REQUIRE_RUNTIME_DEPS: '1', build,
  # pnpm audit, xvfb-run -a pnpm test:electron:smoke) live in verify.yaml, shared with release.yaml.
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yaml
    permissions:
      contents: read
