name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-meta.outputs.version }}
      tag: ${{ steps.release-meta.outputs.tag }}
      release_name: ${{ steps.release-meta.outputs.release_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read package version
        id: release-meta
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Manual releases must be started from the main branch (got ${GITHUB_REF}). Re-run the workflow with 'Use workflow from: main'." >&2
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" != "${TAG}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}. Expected ${TAG}." >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=Layang ${TAG}" >> "$GITHUB_OUTPUT"
      - name: Require a CHANGELOG section for this version
        shell: bash
        env:
          VERSION: ${{ steps.release-meta.outputs.version }}
        run: |
          set -euo pipefail
          # Same extraction as the publish job; fails before any packaging work starts.
          awk -v version="${VERSION}" '
            $0 ~ "^## " { if (found) exit; if ($2 == version) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::CHANGELOG.md has no '## ${VERSION}' section (or it is empty). Add release notes before releasing." >&2
            exit 1
          fi

  verify:
    name: Verify
    needs: prepare
    # Same gate as pull requests (verify-pr.yaml).
    uses: ./.github/workflows/verify.yaml
    permissions:
      contents: read

  package-windows:
    name: Package Windows desktop + CLI
    needs:
      - prepare
      - verify
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare optional Windows code-signing certificate
        # Signing stays off unless the WINDOWS_CERTIFICATE_PFX_BASE64 secret is set.
        # forge.config.js reads WINDOWS_CERTIFICATE_FILE and WINDOWS_CERTIFICATE_PASSWORD.
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_BASE64)) {
            Write-Host "WINDOWS_CERTIFICATE_PFX_BASE64 is not set; building unsigned Windows artifacts."
            exit 0
          }
          $certificate = Join-Path $env:RUNNER_TEMP "layang-code-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          "WINDOWS_CERTIFICATE_FILE=$certificate" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Windows code-signing certificate written to the runner temp directory."
      - name: Build Windows desktop
        run: pnpm run desktop:win
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - name: Remove code-signing certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERTIFICATE_FILE -and (Test-Path $env:WINDOWS_CERTIFICATE_FILE)) {
            Remove-Item -Force $env:WINDOWS_CERTIFICATE_FILE
          }
      - name: Build standalone Windows CLI
        run: pnpm run cli:dist
      - name: Create CLI checksum
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -Path "dist/cli/layang-cli-windows-*.zip" -File)
          if ($archives.Count -ne 1) { throw "Expected exactly one Windows CLI archive, found $($archives.Count)." }
          $archive = $archives[0]
          $hash = (Get-FileHash -Algorithm SHA256 $archive.FullName).Hash.ToLowerInvariant()
          "$hash  $($archive.Name)" | Set-Content -Encoding ascii "$($archive.FullName).sha256"
      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: layang-windows-${{ needs.prepare.outputs.version }}
          path: |
            dist/make/**/*.exe
            dist/make/**/*.nupkg
            dist/make/**/RELEASES
            dist/make/**/*.zip
            dist/cli/layang-cli-windows-*.zip
            dist/cli/layang-cli-windows-*.zip.sha256
          if-no-files-found: error
          retention-days: 14

  package-linux:
    name: Package Linux desktop + CLI
    needs:
      - prepare
      - verify
    runs-on: ubuntu-24.04 # rpm 4.20+ (newer images) breaks electron-installer-redhat %install paths
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Linux desktop
        run: pnpm run desktop:linux
      - name: Build standalone Linux CLI
        run: pnpm run cli:dist
      - name: Create CLI checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/cli/layang-cli-linux-*.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one Linux CLI archive, found ${#archives[@]}." >&2
            exit 1
          fi
          (cd "$(dirname "${archives[0]}")" && sha256sum "$(basename "${archives[0]}")") > "${archives[0]}.sha256"
      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: layang-linux-${{ needs.prepare.outputs.version }}
          path: |
            dist/make/**/*.zip
            dist/make/**/*.deb
            dist/make/**/*.rpm
            dist/cli/layang-cli-linux-*.tar.gz
            dist/cli/layang-cli-linux-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish draft GitHub Release
    # Configure the "release" environment with required reviewers (see CONTRIBUTING.md).
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs:
      - prepare
      - package-windows
      - package-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create release tag from package version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Release tags may only be created from main (got ${GITHUB_REF})." >&2
            exit 1
          fi
          git fetch --tags --force origin
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            TAG_COMMIT="$(git rev-list -n 1 "${TAG}")"
            if [ "${TAG_COMMIT}" != "${GITHUB_SHA}" ]; then
              echo "Tag ${TAG} already exists on a different commit." >&2
              exit 1
            fi
          else
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "${TAG}"
          fi
      - name: Extract release notes from CHANGELOG.md
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          awk -v version="${VERSION}" '
            $0 ~ "^## " { if (found) exit; if ($2 == version) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::CHANGELOG.md has no '## ${VERSION}' section (or it is empty)." >&2
            exit 1
          fi
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts
      - name: Verify standalone CLI assets
        shell: bash
        run: |
          set -euo pipefail
          require_one() {
            local pattern="$1"
            mapfile -t files < <(find release-artifacts -type f -name "$pattern" -print)
            if [ "${#files[@]}" -ne 1 ]; then
              echo "Expected exactly one ${pattern}; found ${#files[@]}." >&2
              exit 1
            fi
          }
          require_one "layang-cli-windows-*.zip"
          require_one "layang-cli-windows-*.zip.sha256"
          require_one "layang-cli-linux-*.tar.gz"
          require_one "layang-cli-linux-*.tar.gz.sha256"
      - name: Generate SHA256SUMS for all release assets
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifacts
          mapfile -t files < <(find . -type f ! -name SHA256SUMS -print | LC_ALL=C sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi
          # Release assets are uploaded flat by file name, so every name must be unique.
          duplicates="$(for f in "${files[@]}"; do basename "$f"; done | LC_ALL=C sort | uniq -d)"
          if [ -n "${duplicates}" ]; then
            echo "Duplicate release asset names: ${duplicates}" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            (cd "$(dirname "$f")" && sha256sum "$(basename "$f")")
          done | LC_ALL=C sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-artifacts/**/*
      - name: Create draft release
        # Draft until a maintainer publishes it: update.electronjs.org only serves published
        # releases, so users are not offered the update before then.
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
          files: release-artifacts/**/*
