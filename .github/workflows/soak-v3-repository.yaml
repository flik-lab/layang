name: Canonical v3 Sustained Repository Soak

on:
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * 0"

permissions:
  contents: read

jobs:
  node-repository-soak:
    name: 10k file-backed scenarios / 30-minute heap plateau
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - name: Execute 30-minute sustained repository soak
        run: node --expose-gc scripts/benchmarks/soak-v3-repository.cjs 10000 1800 artifacts/v3-soak.json
      - name: Upload raw soak telemetry even on failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: layang-v3-repository-soak
          path: artifacts/v3-soak.json
          if-no-files-found: warn
          retention-days: 30
