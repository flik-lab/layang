name: Canonical v3 Sustained Repository Soak

on:
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * 0"

permissions:
  contents: read

jobs:
  node-repository-soak:
    name: 10k file-backed scenarios / 30-minute heap plateau
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Execute 30-minute sustained repository soak
        run: node --expose-gc scripts/benchmarks/soak-v3-repository.cjs 10000 1800 artifacts/v3-soak.json
      - name: Upload raw soak telemetry even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layang-v3-repository-soak
          path: artifacts/v3-soak.json
          if-no-files-found: warn
          retention-days: 30
